name: fuguang
description: 浮光——纯本地运行的跨平台个性化内容推荐应用
publish_to: 'none'
version: 0.3.211+4

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  provider: ^6.1.2

  # 网络
  http: ^1.2.1
  dio: ^5.4.3+1

  # 本地存储
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4

  # 图片
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # 工具
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  html: ^0.15.4
  url_launcher: ^6.3.0
  android_intent_plus: ^4.0.3
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3

  # 动画与UI
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1

  # WebView（用于平台登录）
  webview_flutter: ^4.8.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
